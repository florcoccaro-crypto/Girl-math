<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mis gastos</title>
<meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mis gastos">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#13212b;--mut:#66788a;--line:#e0e7ec;--acc:#0f766e;--accT:#fff;--neg:#c2410c;--pos:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1418;--card:#16212a;--ink:#e8eff3;--mut:#8ea1ae;--line:#243441;--acc:#2dd4bf;--accT:#06201d;--neg:#fb923c;--pos:#2dd4bf}}
:root[data-theme=dark]{--bg:#0d1418;--card:#16212a;--ink:#e8eff3;--mut:#8ea1ae;--line:#243441;--acc:#2dd4bf;--accT:#06201d;--neg:#fb923c;--pos:#2dd4bf}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,system-ui,sans-serif}
#v{padding:14px 14px 150px;max-width:560px;margin:auto}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top b{font-size:19px;font-weight:800;text-transform:capitalize}
.top button,.x{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards .card:last-child{grid-column:span 2}
.k{color:var(--mut);font-size:12px}.n{font-size:20px;font-weight:800}.neg{color:var(--neg)}.pos{color:var(--pos)}
.hist{display:flex;gap:6px;align-items:flex-end;height:96px}.hist div{flex:1;text-align:center;font-size:11px;color:var(--mut);cursor:pointer}
.hist i{display:block;background:var(--line);border-radius:6px 6px 2px 2px;margin-bottom:4px}.hist .on i{background:var(--acc)}.hist .on{color:var(--ink);font-weight:600}
.br{margin:9px 0}.r{display:flex;justify-content:space-between;font-size:14px}.t{height:6px;background:var(--line);border-radius:4px;margin-top:4px}.t i{display:block;height:100%;background:var(--acc);border-radius:4px}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}li:last-child{border:0}
li small{display:block;color:var(--mut);font-size:12px}li b{white-space:nowrap}.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--mut)}
.dim{opacity:.55}.empty{color:var(--mut);text-align:center;padding:18px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:13px 0;font:600 13px Manrope,system-ui,sans-serif}nav .on{color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accT);border:0;border-radius:28px;height:54px;padding:0 20px;font:800 16px Manrope,system-ui,sans-serif;box-shadow:0 6px 18px #0004}
#ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:5}
#sheet{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#sheet h3{margin:0 0 10px}label{display:block;font-size:12px;color:var(--mut);margin:9px 0}
input,select{width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:16px Manrope,system-ui,sans-serif}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}.chk input{width:auto;margin:0}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 14px Manrope,system-ui,sans-serif}.seg .on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.pri,.sec{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:0;font:800 15px Manrope,system-ui,sans-serif;background:var(--acc);color:var(--accT)}.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.dng{color:var(--neg)}
.row{display:flex;gap:8px}.row input{flex:1}.row button{margin-top:4px;border-radius:10px;border:0;background:var(--acc);color:var(--accT);padding:0 16px;font:800 14px Manrope,system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;background:var(--card)}.chip u{text-decoration:none;color:var(--mut);padding:0 6px}
</style></head><body><div id="v"></div>
<button class="fab" onclick="openAdd()">+ Agregar</button>
<nav><button data-t="mes" onclick="go('mes')">Mes</button><button data-t="fij" onclick="go('fij')">Fijos</button><button data-t="deu" onclick="go('deu')">Me deben</button><button data-t="cfg" onclick="go('cfg')">Ajustes</button></nav>
<div id="ov" hidden onclick="if(event.target==this)closeS()"><div id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dim=(y,m)=>new Date(y,m,0).getDate();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function addM(s,k){let[y,m,d]=s.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=(m-1)%12+1;return y+'-'+pad(m)+'-'+pad(Math.min(d,dim(y,m)))}
const shiftYM=(ym,k)=>addM(ym+'-01',k).slice(0,7),mlabel=ym=>MES[+ym.slice(5)-1]+' '+ym.slice(0,4);
let S={cats:{g:['Supermercado','Transporte','Salidas','Servicios','Salud','Educación','Otros'],i:['Sueldo','Otros ingresos']},methods:['Efectivo','Débito','Tarjeta de crédito','Transferencia','Mercado Pago'],tx:[],fixed:[],debts:[]};
let ym=today().slice(0,7),tab='mes',curType='g',dbDoc=null,st;
function save(){try{localStorage.setItem('gastos_app',JSON.stringify(S))}catch(e){}clearTimeout(st);st=setTimeout(()=>{if(dbDoc)dbDoc.set({json:JSON.stringify(S)}).catch(()=>{})},500)}
const sum=l=>l.reduce((s,e)=>s+e.amount,0),pend=d=>d.part-d.ret.reduce((s,r)=>s+r.amt,0);
function entries(m){
 const E=S.tx.filter(t=>t.date.startsWith(m)).map(t=>({src:'t',id:t.id,date:t.date,type:t.type,amount:t.amount,cat:t.cat,method:t.method,note:t.note,tag:t.n>1?`${t.k}/${t.n}`:t.debt?'compartido':''}));
 S.fixed.filter(f=>f.start<=m).forEach(f=>{const[y,mo]=m.split('-').map(Number);E.push({src:'f',id:f.id,date:m+'-'+pad(Math.min(f.day,dim(y,mo))),type:'g',amount:f.amount,cat:f.cat,method:f.method,note:f.name,tag:'fijo'})});
 S.debts.forEach(d=>d.ret.filter(r=>r.date.startsWith(m)).forEach(r=>E.push({src:'r',id:d.id+':'+r.id,date:r.date,type:'i',amount:r.amt,cat:'Devolución',method:r.method,note:'Devolución de '+d.who+' · '+d.note,tag:''})));
 return E.sort((a,b)=>b.date.localeCompare(a.date));
}
function bars(l,key){const g={};l.forEach(e=>g[e[key]]=(g[e[key]]||0)+e.amount);const a=Object.entries(g).sort((x,y)=>y[1]-x[1]),mx=a.length?a[0][1]:1;
 return a.length?a.map(([n,v])=>`<div class=br><div class=r><span>${esc(n)}</span><b>${fmt(v)}</b></div><div class=t><i style="width:${v/mx*100}%"></i></div></div>`).join(''):'<div class=empty>Sin datos</div>'}
function vMes(){
 const E=entries(ym),inc=E.filter(e=>e.type=='i'),exp=E.filter(e=>e.type=='g'),ti=sum(inc),tg=sum(exp);
 const H=[];for(let k=-5;k<=0;k++){const m=shiftYM(ym,k);H.push([m,sum(entries(m).filter(e=>e.type=='g'))])}
 const mx=Math.max(1,...H.map(h=>h[1]));
 return `<div class=top><button onclick="mv(-1)">‹</button><b>${mlabel(ym)}</b><button onclick="mv(1)">›</button></div>
 <div class=cards><div class=card><div class=k>Ingresos</div><div class="n pos">${fmt(ti)}</div></div><div class=card><div class=k>Gastos</div><div class="n neg">${fmt(tg)}</div></div><div class=card><div class=k>Balance del mes</div><div class=n>${fmt(ti-tg)}</div></div></div>
 <h2>Gastos mes a mes</h2><div class="card hist">${H.map(([m,v])=>`<div class="${m==ym?'on':''}" onclick="ym='${m}';render()"><i style="height:${Math.max(3,v/mx*64)}px"></i>${MES[+m.slice(5)-1].slice(0,3)}</div>`).join('')}</div>
 <h2>Gastos por categoría</h2><div class=card>${bars(exp,'cat')}</div>
 <h2>Gastos por método de pago</h2><div class=card>${bars(exp,'method')}</div>
 ${inc.length?`<h2>Ingresos por método de pago</h2><div class=card>${bars(inc,'method')}</div>`:''}
 <h2>Movimientos</h2><div class=card>${E.length?`<ul>${E.map(e=>`<li onclick="det('${e.src}','${e.id}')"><span>${esc(e.note||e.cat)}${e.tag?`<span class=tag>${e.tag}</span>`:''}<small>${e.date.slice(8)}/${e.date.slice(5,7)} · ${esc(e.cat)} · ${esc(e.method)}</small></span><b class="${e.type=='g'?'neg':'pos'}">${e.type=='g'?'−':'+'}${fmt(e.amount)}</b></li>`).join('')}</ul>`:'<div class=empty>Todavía no hay movimientos este mes</div>'}</div>`}
function vFij(){return `<div class=top><b>Gastos fijos</b></div><div class=card>${S.fixed.length?`<ul>${S.fixed.map(f=>`<li><span>${esc(f.name)}<small>Todos los meses el día ${f.day} · ${esc(f.method)} · desde ${mlabel(f.start)}</small></span><span><b class=neg>${fmt(f.amount)}</b> <button class=x onclick="delFix('${f.id}')">✕</button></span></li>`).join('')}</ul>`:'<div class=empty>Agregá un gasto con tipo “Fijo mensual” y aparece cada mes solo.</div>'}</div><button class=sec onclick="openAdd('g','f')">+ Nuevo gasto fijo</button>`}
function vDeu(){const tot=S.debts.reduce((s,d)=>s+Math.max(0,pend(d)),0),L=[...S.debts].sort((a,b)=>(pend(b)>0)-(pend(a)>0));
 return `<div class=top><b>Gastos compartidos</b></div><div class=card><div class=k>Te deben en total</div><div class="n pos">${fmt(tot)}</div></div><h2>Detalle</h2><div class=card>${L.length?`<ul>${L.map(d=>{const p=pend(d);return `<li class="${p<=0?'dim':''}"><span>${esc(d.who)} · ${esc(d.note)}<small>Le corresponde ${fmt(d.part)} · devolvió ${fmt(d.part-p)}</small>${p>0?`<button class=sec style="width:auto;padding:6px 12px;margin-top:6px" onclick="retSheet('${d.id}')">Registrar devolución</button>`:'<small>Saldado ✓</small>'}</span><span><b class="${p>0?'pos':''}">${fmt(Math.max(0,p))}</b> <button class=x onclick="delDebt('${d.id}')">✕</button></span></li>`}).join('')}</ul>`:'<div class=empty>Marcá un gasto como “compartido” al cargarlo</div>'}</div>`}
function chips(t,l){return `<div class=chips>${l.map((c,i)=>`<span class=chip>${esc(c)}<u onclick="delOpt('${t}',${i})">✕</u></span>`).join('')}</div>`}
function vCfg(){return `<div class=top><b>Ajustes</b></div><h2>Categorías de gastos</h2><div class=card><div class=row><input id=nc1 placeholder="Nueva categoría"><button onclick="addOpt('g','nc1')">Agregar</button></div>${chips('g',S.cats.g)}</div>
 <h2>Categorías de ingresos</h2><div class=card><div class=row><input id=nc2 placeholder="Nueva categoría"><button onclick="addOpt('i','nc2')">Agregar</button></div>${chips('i',S.cats.i)}</div>
 <h2>Métodos de pago</h2><div class=card><div class=row><input id=nc3 placeholder="Ej: Visa, Brubank…"><button onclick="addOpt('m','nc3')">Agregar</button></div>${chips('m',S.methods)}</div>`}
function render(){$('#v').innerHTML={mes:vMes,fij:vFij,deu:vDeu,cfg:vCfg}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
const go=t=>{tab=t;render();scrollTo(0,0)},mv=k=>{ym=shiftYM(ym,k);render()};
function ov(h){$('#sheet').innerHTML=h;$('#ov').hidden=false}function closeS(){$('#ov').hidden=true}
const opts=l=>l.map(c=>`<option>${esc(c)}</option>`).join('');
function openAdd(t,k){curType=t||curType;const g=curType=='g';
 ov(`<h3>Nuevo movimiento</h3><div class=seg><button class="${g?'on':''}" onclick="openAdd('g')">Gasto</button><button class="${g?'':'on'}" onclick="openAdd('i')">Ingreso</button></div>
 <label>Monto<input id=f_a type=number inputmode=decimal step=any></label><label>Fecha<input id=f_d type=date value="${today()}"></label>
 <label>Categoría<select id=f_c>${opts(S.cats[curType])}</select></label><label>Método de pago<select id=f_m>${opts(S.methods)}</select></label><label>Detalle<input id=f_n placeholder="Opcional"></label>
 ${g?`<label>Tipo de gasto<select id=f_k onchange=tg()><option value=u>Único</option><option value=c>En cuotas</option><option value=f ${k=='f'?'selected':''}>Fijo mensual (todos los meses)</option></select></label>
 <label id=f_cw hidden>Cantidad de cuotas (se divide el monto total)<input id=f_nc type=number value=3 min=2></label>
 <label class=chk id=f_sw><input type=checkbox id=f_s onchange=tg()> Fue un gasto compartido</label>
 <div id=f_sd hidden><label>Quién te debe<input id=f_w placeholder="Nombre"></label><label>Cuánto te deben en total<input id=f_p type=number inputmode=decimal step=any></label></div>`:''}
 <button class=pri onclick=saveAdd()>Guardar</button>`);if(g)tg()}
function tg(){const k=$('#f_k').value;$('#f_cw').hidden=k!='c';$('#f_sw').hidden=k=='f';const on=$('#f_s').checked&&k!='f';$('#f_sd').hidden=!on;if(on&&!$('#f_p').value)$('#f_p').value=Math.round(($('#f_a').value||0)/2*100)/100||''}
function saveAdd(){const v=i=>$('#'+i)?.value,amt=parseFloat(v('f_a')),date=v('f_d'),cat=v('f_c'),method=v('f_m'),note=(v('f_n')||'').trim();
 if(!(amt>0)||!date){alert('Completá monto y fecha');return}
 if(curType=='i')S.tx.push({id:uid(),date,type:'i',amount:amt,cat,method,note});
 else{const k=v('f_k');
  if(k=='f')S.fixed.push({id:uid(),name:note||cat,amount:amt,day:+date.slice(8),cat,method,start:date.slice(0,7)});
  else{const n=k=='c'?Math.max(2,parseInt(v('f_nc'))||2):1,gid=uid(),did=$('#f_s').checked?uid():null;let rest=amt;
   for(let i=0;i<n;i++){const a=i==n-1?rest:Math.round(amt/n*100)/100;rest=Math.round((rest-a)*100)/100;S.tx.push({id:uid(),gid,k:i+1,n,date:addM(date,i),type:'g',amount:a,cat,method,note,debt:did})}
   if(did)S.debts.push({id:did,who:(v('f_w')||'').trim()||'Alguien',note:note||cat,part:parseFloat(v('f_p'))||amt/2,ret:[]})}}
 save();closeS();render()}
function det(src,id){
 if(src=='t'){const t=S.tx.find(x=>x.id==id);ov(`<h3>${esc(t.note||t.cat)}</h3><p>${fmt(t.amount)} · ${esc(t.cat)} · ${esc(t.method)}<br>${t.date}${t.n>1?` · cuota ${t.k} de ${t.n}`:''}</p><button class="sec dng" onclick="delTx('${id}',0)">Eliminar${t.n>1?' esta cuota':''}</button>${t.n>1?`<button class="sec dng" onclick="delTx('${id}',1)">Eliminar todas las cuotas</button>`:''}<button class=sec onclick=closeS()>Cerrar</button>`)}
 else if(src=='f')ov(`<h3>Gasto fijo</h3><p>Se genera solo cada mes. Para borrarlo, andá a la pestaña Fijos.</p><button class=sec onclick=closeS()>Cerrar</button>`);
 else{const[d,r]=id.split(':');ov(`<h3>Devolución</h3><p>Podés eliminarla si la cargaste por error.</p><button class="sec dng" onclick="delRet('${d}','${r}')">Eliminar devolución</button><button class=sec onclick=closeS()>Cerrar</button>`)}}
function delTx(id,all){if(!confirm('¿Eliminar?'))return;const t=S.tx.find(x=>x.id==id),del=all?S.tx.filter(x=>x.gid==t.gid):[t],ids=new Set(del.map(x=>x.id));
 S.tx=S.tx.filter(x=>!ids.has(x.id));const ds=new Set(del.map(x=>x.debt).filter(Boolean));S.debts=S.debts.filter(d=>!ds.has(d.id)||S.tx.some(x=>x.debt==d.id));save();closeS();render()}
const delFix=id=>{if(confirm('¿Eliminar este gasto fijo?')){S.fixed=S.fixed.filter(f=>f.id!=id);save();render()}};
const delDebt=id=>{if(confirm('¿Eliminar este gasto compartido y sus devoluciones?')){S.debts=S.debts.filter(d=>d.id!=id);S.tx.forEach(t=>{if(t.debt==id)t.debt=null});save();render()}};
const delRet=(d,r)=>{const x=S.debts.find(q=>q.id==d);x.ret=x.ret.filter(q=>q.id!=r);save();closeS();render()};
function retSheet(id){const d=S.debts.find(x=>x.id==id);ov(`<h3>Devolución de ${esc(d.who)}</h3><label>Monto<input id=r_a type=number inputmode=decimal step=any value="${pend(d)}"></label><label>Fecha<input id=r_d type=date value="${today()}"></label><label>Método con el que te pagó<select id=r_m>${opts(S.methods)}</select></label><button class=pri onclick="saveRet('${id}')">Guardar</button>`)}
function saveRet(id){const a=parseFloat($('#r_a').value);if(!(a>0))return;S.debts.find(x=>x.id==id).ret.push({id:uid(),amt:a,date:$('#r_d').value||today(),method:$('#r_m').value});save();closeS();render()}
function addOpt(t,i){const v=$('#'+i).value.trim();if(!v)return;const l=t=='m'?S.methods:S.cats[t];if(!l.includes(v))l.push(v);save();render()}
function delOpt(t,i){(t=='m'?S.methods:S.cats[t]).splice(i,1);save();render()}
async function init(){
 try{const s=localStorage.getItem('gastos_app');if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
 render();
 try{if(window.claude&&claude.use){const[db,u]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(db&&u){dbDoc=db.collection('data/users/'+await u.id()).doc('state');const s=await dbDoc.get();
   if(s.exists&&s.data().json){S=Object.assign(S,JSON.parse(s.data().json));try{localStorage.setItem('gastos_app',JSON.stringify(S))}catch(e){}render()}else save()}}}catch(e){}
}
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
